# One Postgres per checkout: the Makefile sets the project name, the port, and the data
# directory for each (see DEV_STATE_DIR), so run it through `make postgres`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${OPEN_SWE_POSTGRES_PORT:?run make dev-init}:5432"
    volumes:
      - "${OPEN_SWE_POSTGRES_DATA:?run make dev-init}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 30
